# Usage schedule for one specific day.
# moveable: if true, the entry can be rescheduled to a different time of day
#           (washing, drying, dishwasher). Fixed (false) entries must run at
#           the stated time (coffee, cooking, evening TV). A future MILP layer
#           can shift the moveable entries to the cheapest window.
# device_id references the rec_id in device.yaml.

- rec_id: 1
  device_id: 11    # Kettle (morning coffee)
  start: "2026-05-21T07:00"
  end:   "2026-05-21T07:05"
  moveable: false

- rec_id: 2
  device_id: 21    # Radio (background music through the day)
  start: "2026-05-21T08:00"
  end:   "2026-05-21T18:00"
  moveable: false

- rec_id: 3
  device_id: 5     # Washing machine
