# Hourly dynamic electricity tariff for one day.
# Inspired by the Frank Energie "Dynamisch" / Engie "Flex Dynamic" tariffs that
# follow the day-ahead BELPEX (EPEX SPOT) price per hour.
#
#   import_price_eur_per_kwh : what you pay to take energy FROM the grid.
#                              = day-ahead spot + ~0.15 €/kWh of network costs,
#                                taxes (capacity tariff, federal contribution),
#                                supplier margin and VAT.
#   export_price_eur_per_kwh : what you receive for putting energy ON the grid.
#                              = day-ahead spot (no extra costs added).
#
# Numbers are illustrative for 2026-05-21 — a sunny day with cheap midday
# generation (solar floods the market) and an expensive evening peak.

- rec_id: 1
  date: "2026-05-21"
  hour_start: 0
  hour_end: 1
  import_price_eur_per_kwh: 0.23
  export_price_eur_per_kwh: 0.08

